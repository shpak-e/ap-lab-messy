name: release
# Pipeline demo: triggered by CI (workflow_run) and fans out to a reusable
# workflow in ap-lab-chain (cross-repo `calls` edge).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: echo "publish release"
  deploy:
    needs: publish
    uses: shpak-e/ap-lab-chain/.github/workflows/deploy-infra.yml@main
